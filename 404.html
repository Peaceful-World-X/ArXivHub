<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="canonical" href="https://arxivhub.github.io/">
    <title>ArXiv Hub · 论桥</title>
    <script>
      (() => {
        const current = new URL(window.location.href);
        const target = new URL("https://arxivhub.github.io/");
        const redirectFlag = "__arxivhub_redirect";
        target.pathname = current.pathname.replace(/^\/ArXivHub(?=\/|$)/, "") || "/";
        target.search = current.search;
        target.hash = current.hash;

        if (current.searchParams.get(redirectFlag) === "1") return;
        target.searchParams.set(redirectFlag, "1");
        window.location.replace(target.href);
      })();
    </script>
  </head>
  <body></body>
</html>
