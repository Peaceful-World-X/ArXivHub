<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8f6" />
    <meta name="description" content="🎉ArXiv Hub · 论桥：输入 arXiv ID，原文、解读、翻译、代码和讨论等一站式上桥~" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>ArXiv Hub · 论桥</title>
    <script>
      if (window.location.hostname === "arxivhub.com") {
        const target = new URL("https://arxivhub.github.io/");
        target.pathname = window.location.pathname;
        target.search = window.location.search;
        target.hash = window.location.hash;
        window.location.replace(target.href);
      }
    </script>
  </head>
  <body>
    <div id="root">
      <a href="https://xinquji.com" target="_blank" rel="noopener noreferrer"><img src="https://xinquji.com/badge?lang=en" alt="Featured on Xinquji.com" style="width:200px;height:54px;" width="200" height="54" /></a>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
