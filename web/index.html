<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8f6" />
    <meta name="description" content="🎉ArXiv Hub · 论桥：输入 arXiv ID，原文、解读、翻译、代码和讨论等一站式上桥~" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>ArXiv Hub · 论桥</title>
    <script>
      (() => {
        const current = new URL(window.location.href);
        const redirectFlag = "__arxivhub_redirect";
        if (current.hostname !== "arxivhub.github.io" || !current.searchParams.has(redirectFlag)) return;
        current.searchParams.delete(redirectFlag);
        window.history.replaceState(null, "", `${current.pathname}${current.search}${current.hash}`);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
