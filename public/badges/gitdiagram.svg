<svg xmlns="http://www.w3.org/2000/svg" width="110" height="20" viewBox="0 0 110 20" role="img" aria-label="GitDiagram">
  <title>GitDiagram</title>
  <defs>
    <clipPath id="badge-clip">
      <rect width="110" height="20" rx="3"/>
    </clipPath>
    <linearGradient id="badge-shade" x2="0" y2="100%">
      <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
      <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#badge-clip)">
    <path fill="#cca6c4" d="M0 0h34v20H0z"/>
    <path fill="#494368" d="M34 0h76v20H34z"/>
    <rect width="110" height="20" fill="url(#badge-shade)"/>
  </g>
  <g fill="#261120">
    <path d="M17 8v3M11 14v-3h12v3" fill="none" stroke="#261120" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="14" y="4" width="6" height="4" rx=".8"/>
    <rect x="8" y="13" width="6" height="4" rx=".8"/>
    <rect x="20" y="13" width="6" height="4" rx=".8"/>
  </g>
  <g text-anchor="middle" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="11">
    <text x="72" y="15" fill="#010101" fill-opacity=".3" aria-hidden="true">GitDiagram</text>
    <text x="72" y="14" fill="#fff">GitDiagram</text>
  </g>
</svg>
