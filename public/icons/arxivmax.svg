    <path class="acc-s" d="M18 46 39 25" />
  </g>
  <path class="acc-f" d="M46 11 C48 16 48 16 53 18 C48 20 48 20 46 25 C44 20 44 20 39 18 C44 16 44 16 46 11 Z" />
